<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاعل كيمياء الفضاء - طبقات الغلاف الجوي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
        }

        /* شريحة الغلاف الجوي مع تفعيل التمرير (Scroll) بسلاسة */
        .atmosphere-slide {
            width: 100vw;
            min-height: 100dvh; /* الحد الأدنى هو ارتفاع الشاشة بالكامل ويسمح بالتمرير إذا زاد المحتوى */
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* يبدأ من الأعلى ليسمح بالتمرير لأسفل */
            align-items: center;
            background: linear-gradient(to bottom, #020024, #090979, #00d4ff);
            padding: 30px 20px;
            overflow-y: auto; /* السماح بالتحريك لأعلى وأسفل للوصول للأزرار السفلية */
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: auto 0; /* توسيط المحتوى عمودياً إن كان قصيراً، ويسمح بالمرونة عند التمرير */
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #00ffd5;
            text-align: center;
        }

        .layers-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .layer-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* مشغل الصوت */
        audio {
            width: 100%;
            margin-top: 15px;
            border-radius: 30px;
        }

        /* أزرار أسفل الصفحة (تجريبية جاهزة للاستخدام) */
        .buttons-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #00ffd5;
            color: #0b0f19;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .action-btn:hover {
            background-color: #00b39b;
        }
    </style>
</head>
<body>

    <div class="atmosphere-slide">
        <div class="container">
            <h1>ترتيب طبقات الغلاف الجوي</h1>
            
            <div class="layers-box">
                <div class="layer-item">1. التروبوسفير (Troposphere)</div>
                <div class="layer-item">2. الستراتوسفير (Stratosphere)</div>
                <div class="layer-item">3. الميزوسفير (Mesosphere)</div>
                <div class="layer-item">4. الثيرموسفير (Thermosphere)</div>
                <div class="layer-item">5. الإكسوسفير (Exosphere)</div>
            </div>

            <!-- مشغل ملف الصوت المرفق -->
            <audio controls>
                <source src="story_audio.mp3" type="audio/mpeg">
                متصفحك لا يدعم تشغيل الملف الصوتى.
            </audio>

            <!-- الأزرار السفلية التي أضفناها لتظهر عند التمرير -->
            <div class="buttons-container">
                <button class="action-btn">السابق</button>
                <button class="action-btn">التالي</button>
            </div>
        </div>
    </div>

</body>
</html>
